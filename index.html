<!DOCTYPE html>
<head>
  <title>GVRM Multi Avatar Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      font-size: 12px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 12px;
      border-radius: 5px;
      display: none; /* Hidden by default */
      max-width: 280px;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <!-- Combined controls + info panel (hidden by default) -->
  <div id="controls">
    <b>Controls</b><br>
    1-4: Load avatars | QWER: Load animations<br>
    0: Instant animation reset<br>
    G: Toggle solid background<br>
    K: Pick background color<br>
    I: Toggle this panel<br>
    <br><b>Status:</b><br>
    Slot 1: Chicken Dance<br>
    Slot 2: Jab Cross<br>
    Slot 3: Happy Idle<br>
    Slot 4: Flying
  </div>

  <!-- hidden color picker for background -->
  <input
    id="bgColorPicker"
    type="color"
    value="#00ff00"
    style="position:absolute; left:-9999px; top:-9999px;"
  >

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js",
        "gaussian-splats-3d": "https://naruya.github.io/gs-edit/lib/gaussian-splats-3d.module.js",
        "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm",
        "gvrm": "https://naruya.github.io/gs-edit/lib/gaussian-vrm.min.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GVRM } from 'gvrm';

    const canvas = document.getElementById('canvas');
    const controlsDiv = document.getElementById('controls');
    const bgColorPicker = document.getElementById('bgColorPicker');
    
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();

    // Background control state
    let useSolidBackground = true;
    let solidBgColor = new THREE.Color(0x00ff00);
    renderer.setClearColor(solidBgColor, 1);
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2.4, 2.0, 8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(2.5, 1.2, 0);
    controls.enablePan = false;
    controls.update();

    // Avatar container
    const gvRMs = [];
    const avatarPaths = ['./avatars/Avatar1.gvrm', './avatars/Avatar2.gvrm', './avatars/Avatar3.gvrm', './avatars/Avatar4.gvrm'];
    const animations = ['./animations/Chicken Dance.fbx', './animations/Jab Cross.fbx', './animations/Happy Idle.fbx', './animations/Flying.fbx'];

    // Load default avatars
    for (let i = 0; i < avatarPaths.length; i++) {
      try {
        const g = await GVRM.load(avatarPaths[i], scene, camera, renderer);
        const char = g.character.currentVrm.scene;
        char.position.set(i * 1.8, 0, 0);
        char.scale.setScalar(0.75);
        await g.changeFBX(animations[i]);
        g.character.action.play();
        g.character.transitionDuration = 0; // Instant transitions
        gvRMs.push(g);
      } catch (err) {
        console.warn(`Could not load ${avatarPaths[i]}`, err);
        gvRMs.push(null);
      }
    }

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Mouse wheel zoom
    const minDistance = 2.0;
    const maxDistance = 25.0;
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const dir = new THREE.Vector3();
      dir.subVectors(camera.position, controls.target).normalize();
      const distance = camera.position.distanceTo(controls.target);
      let newDist = distance + e.deltaY * 0.002;
      newDist = Math.max(minDistance, Math.min(maxDistance, newDist));
      camera.position.copy(controls.target).add(dir.multiplyScalar(newDist));
      controls.update();
    }, { passive: false });

    // Color picker event - FIXED: use change event and focus
    bgColorPicker.addEventListener('change', (e) => {
      const hex = e.target.value;
      solidBgColor.set(hex);
      if (useSolidBackground) {
        renderer.setClearColor(solidBgColor, 1);
      }
    });

    // Force color picker to open reliably
    const openColorPicker = () => {
      bgColorPicker.focus();
      bgColorPicker.click();
      setTimeout(() => bgColorPicker.showPicker?.(), 10);
    };

    // Keyboard controls
    window.addEventListener('keydown', async (e) => {
      const key = e.key.toLowerCase();

      // I: Toggle controls panel
      if (key === 'i') {
        controlsDiv.style.display = controlsDiv.style.display === 'none' ? 'block' : 'none';
      }

      // 1-4: Load avatars
      if (key >= '1' && key <= '4') {
        const index = parseInt(key) - 1;
        try {
          const fileHandles = await window.showOpenFilePicker({
            multiple: false,
            types: [{ description: 'GVRM Avatar', accept: { 'application/octet-stream': ['.gvrm'] } }]
          });
          const file = await fileHandles[0].getFile();
          const blob = new Blob([await file.arrayBuffer()]);
          const url = URL.createObjectURL(blob);

          if (gvRMs[index]) await gvRMs[index].remove(scene);

          const newGvrm = await GVRM.load(url, scene, camera, renderer);
          const model = newGvrm.character.currentVrm.scene;
          model.position.set(index * 1.8, 0, 0);
          model.scale.setScalar(0.75);
          newGvrm.character.transitionDuration = 0;
          await newGvrm.changeFBX(animations[index]);
          newGvrm.character.action.play();
          gvRMs[index] = newGvrm;
        } catch (err) {
          console.warn('Avatar load cancelled or failed:', err);
        }
      }

      // QWER: Load animations for slots 1-4
      const animKeys = { 'q': 0, 'w': 1, 'e': 2, 'r': 3 };
      if (animKeys[key] !== undefined) {
        const index = animKeys[key];
        try {
          const fileHandles = await window.showOpenFilePicker({
            multiple: false,
            types: [{ description: 'FBX Animation', accept: { 'model/gltf-binary': ['.fbx'] } }]
          });
          const file = await fileHandles[0].getFile();
          const blob = new Blob([await file.arrayBuffer()]);
          const url = URL.createObjectURL(blob);

          if (gvRMs[index]) {
            gvRMs[index].character.transitionDuration = 0;
            await gvRMs[index].changeFBX(url);
            gvRMs[index].character.action.play();
          }
        } catch (err) {
          console.warn('Animation load cancelled or failed:', err);
        }
      }

      // 0: INSTANT animation reset (no await, no transition)
      if (key === '0') {
        for (let i = 0; i < gvRMs.length; i++) {
          const g = gvRMs[i];
          if (!g) continue;
          g.character.transitionDuration = 0;
          g.changeFBX(animations[i]); // No await = instant
          g.character.action.time = 0; // Reset to start
          g.character.action.play();
        }
      }

      // G: Toggle solid background
      if (key === 'g') {
        useSolidBackground = !useSolidBackground;
        if (useSolidBackground) {
          renderer.setClearColor(solidBgColor, 1);
        } else {
          renderer.setClearColor(0x222222, 1);
        }
      }

      // K: Open color picker - FIXED
      if (key === 'k') {
        openColorPicker();
      }
    });

    // Render loop
    renderer.setAnimationLoop(() => {
      for (const g of gvRMs) g?.update();
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
