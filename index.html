<!DOCTYPE html>
<head>
  <title>GVRM Multi Avatar Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #commands {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      font-size: 13px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="commands">
    <b>Controls</b><br>
    Keys 1–4: Load local avatars<br>
    Key 0: Restart all animations<br>
    Mouse Wheel: Zoom in/out
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js",
        "gvrm": "https://naruya.github.io/gs-edit/lib/gaussian-vrm.min.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GVRM } from 'gvrm';

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2.4, 2.0, 6);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(2, 1.2, 0);
    controls.enablePan = false;
    controls.update();

    // Lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(3, 5, 2);
    scene.add(dirLight);

    // Avatar container
    const gvRMs = [];
    const avatarPaths = [
      './avatars/Avatar1.gvrm',
      './avatars/Avatar2.gvrm',
      './avatars/Avatar3.gvrm',
      './avatars/Avatar4.gvrm'
    ];

    const animations = [
      './animations/ChickenDance.fbx',
      './animations/JabCross.fbx',
      './animations/HappyIdle.fbx',
      './animations/Flying.fbx'
    ];

    // Load default avatars
    for (let i = 0; i < avatarPaths.length; i++) {
      try {
        const g = await GVRM.load(avatarPaths[i], scene, camera, renderer);
        const char = g.character.currentVrm.scene;
        char.position.set(i * 1.8, 0, 0);
        char.scale.setScalar(0.75);
        await g.changeFBX(animations[i]);
        g.character.action.play();
        gvRMs.push(g);
      } catch (err) {
        console.warn(`Could not load ${avatarPaths[i]}`, err);
      }
    }

    // Handle resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Mouse wheel zoom
    const minDistance = 2.0;
    const maxDistance = 20.0;
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const dir = new THREE.Vector3();
      dir.subVectors(camera.position, controls.target).normalize();
      const distance = camera.position.distanceTo(controls.target);
      let newDist = distance + e.deltaY * 0.002;
      newDist = Math.max(minDistance, Math.min(maxDistance, newDist));
      camera.position.copy(controls.target).add(dir.multiplyScalar(newDist));
      controls.update();
    }, { passive: false });

    // Key controls: load local avatar or restart animation
    window.addEventListener('keydown', async (e) => {
      const key = e.key;
      if (key >= '1' && key <= '4') {
        const index = parseInt(key) - 1;
        try {
          const fileHandles = await window.showOpenFilePicker({
            multiple: false,
            types: [{ description: 'GVRM Avatar', accept: { 'application/octet-stream': ['.gvrm'] } }]
          });
          const file = await fileHandles[0].getFile();
          const blob = new Blob([await file.arrayBuffer()]);
          const url = URL.createObjectURL(blob);

          if (gvRMs[index]) await gvRMs[index].remove(scene);
          const newGvrm = await GVRM.load(url, scene, camera, renderer);
          const model = newGvrm.character.currentVrm.scene;
          model.position.set(index * 1.8, 0, 0);
          model.scale.setScalar(0.75);
          await newGvrm.changeFBX(animations[index]);
          newGvrm.character.action.play();
          gvRMs[index] = newGvrm;
        } catch (err) {
          console.warn('File load cancelled or failed:', err);
        }
      }

      if (key === '0') {
        // Restart all animations in sync
        for (let i = 0; i < gvRMs.length; i++) {
          const g = gvRMs[i];
          if (!g) continue;
          await g.changeFBX(animations[i]);
          g.character.action.play();
        }
      }
    });

    // Animation loop
    renderer.setAnimationLoop(() => {
      for (const g of gvRMs) g?.update();
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
