<!DOCTYPE html>
<head>
  <title>GVRM Multi Avatar Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #00ff00; /* Default green */
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: transparent;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      font-size: 12px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 12px;
      border-radius: 5px;
      display: none;
      max-width: 280px;
      z-index: 1000;
    }
    #midi-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 20px;
      border-radius: 10px;
      display: none;
      z-index: 2000;
      font-family: monospace;
    }
    button {
      background: #444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #666; }
    button.listening { background: #ff4444; }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <!-- Combined controls panel (hidden by default) -->
  <div id="controls">
    <b>Controls</b><br>
    1-4: Load avatars | QWER: Load animations<br>
    0: Instant reset (plays custom anims)<br>
    I: Toggle this panel<br>
    M: MIDI reset setup<br>
    <br><b>Status:</b><br>
    Slot 1: <span id="anim1">Chicken Dance</span><br>
    Slot 2: <span id="anim2">Jab Cross</span><br>
    Slot 3: <span id="anim3">Happy Idle</span><br>
    Slot 4: <span id="anim4">Flying</span>
  </div>

  <!-- MIDI Setup Popup -->
  <div id="midi-popup">
    <h3>MIDI Reset Setup</h3>
    <p>Press <b>Listen</b> then press your MIDI key:</p>
    <button id="midi-listen">Listen</button>
    <button id="midi-close">Close</button>
    <div id="midi-status" style="margin-top: 15px; font-size: 14px;"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js",
        "gaussian-splats-3d": "https://naruya.github.io/gs-edit/lib/gaussian-splats-3d.module.js",
        "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm",
        "gvrm": "https://naruya.github.io/gs-edit/lib/gaussian-vrm.min.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GVRM } from 'gvrm';

    const canvas = document.getElementById('canvas');
    const controlsDiv = document.getElementById('controls');
    const animStatus = ['anim1','anim2','anim3','anim4'].map(id => document.getElementById(id));
    const midiPopup = document.getElementById('midi-popup');
    const midiListenBtn = document.getElementById('midi-listen');
    const midiCloseBtn = document.getElementById('midi-close');
    const midiStatus = document.getElementById('midi-status');
    
    const renderer = new THREE.WebGLRenderer({ 
      canvas, 
      antialias: true,
      alpha: true // Transparent canvas
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = null; // Transparent

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2.4, 2.0, 8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(2.5, 1.2, 0);
    controls.enablePan = false;
    controls.update();

    // Track custom animations per avatar (replaces hardcoded defaults)
    const customAnimations = [null, null, null, null];
    const defaultAnimNames = ['Chicken Dance', 'Jab Cross', 'Happy Idle', 'Flying'];

    // Avatar container
    const gvRMs = [];
    const avatarPaths = ['./avatars/Avatar1.gvrm', './avatars/Avatar2.gvrm', './avatars/Avatar3.gvrm', './avatars/Avatar4.gvrm'];

    // Load default avatars
    for (let i = 0; i < avatarPaths.length; i++) {
      try {
        const g = await GVRM.load(avatarPaths[i], scene, camera, renderer);
        const char = g.character.currentVrm.scene;
        char.position.set(i * 1.8, 0, 0);
        char.scale.setScalar(0.75);
        g.character.transitionDuration = 0;
        gvRMs.push(g);
        updateAnimStatus(i, defaultAnimNames[i]);
      } catch (err) {
        console.warn(`Could not load ${avatarPaths[i]}`, err);
        gvRMs.push(null);
      }
    }

    function updateAnimStatus(index, name) {
      if (animStatus[index]) animStatus[index].textContent = name || 'No animation';
    }

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Mouse wheel zoom
    const minDistance = 2.0;
    const maxDistance = 25.0;
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const dir = new THREE.Vector3();
      dir.subVectors(camera.position, controls.target).normalize();
      const distance = camera.position.distanceTo(controls.target);
      let newDist = distance + e.deltaY * 0.002;
      newDist = Math.max(minDistance, Math.min(maxDistance, newDist));
      camera.position.copy(controls.target).add(dir.multiplyScalar(newDist));
      controls.update();
    }, { passive: false });

    // MIDI setup
    let midiListenerActive = false;
    let midiAccess = null;

    async function initMIDI() {
      try {
        midiAccess = await navigator.requestMIDIAccess();
        midiStatus.textContent = 'MIDI devices found. Press Listen.';
      } catch (err) {
        midiStatus.textContent = 'No MIDI support or permission denied';
      }
    }

    midiListenBtn.addEventListener('click', () => {
      if (midiListenerActive) {
        midiListenerActive = false;
        midiListenBtn.textContent = 'Listen';
        midiListenBtn.classList.remove('listening');
        midiStatus.textContent = 'Listening stopped';
        return;
      }

      midiListenerActive = true;
      midiListenBtn.textContent = 'Stop Listening';
      midiListenBtn.classList.add('listening');
      midiStatus.textContent = 'Listening for MIDI input...';
      
      // Listen for MIDI messages
      function onMIDIMessage(message) {
        if (!midiListenerActive) return;
        
        const data = message.data;
        const cmd = data[0];
        const note = data[1];
        const velocity = data[2];
        
        if (cmd === 144 && velocity > 0) { // Note on
          midiStatus.textContent = `MIDI Note ${note} detected! Assigned to reset.`;
          midiListenerActive = false;
          midiListenBtn.textContent = 'Listen';
          midiListenBtn.classList.remove('listening');
          
          // Store MIDI note for reset
          window.midiResetNote = note;
        }
      }

      const inputs = midiAccess.inputs.values();
      for (let input of inputs) {
        input.onmidimessage = onMIDIMessage;
      }
    });

    midiCloseBtn.addEventListener('click', () => {
      midiPopup.style.display = 'none';
      midiListenerActive = false;
    });

    // Continuous MIDI polling for reset
    setInterval(() => {
      if (midiAccess && window.midiResetNote) {
        const inputs = midiAccess.inputs.values();
        for (let input of inputs) {
          // Check recent messages (simplified)
          if (input.onmidimessage) {
            // MIDI reset handled in keydown below
          }
        }
      }
    }, 50);

    // Keyboard controls
    window.addEventListener('keydown', async (e) => {
      const key = e.key.toLowerCase();

      // I: Toggle controls panel
      if (key === 'i') {
        controlsDiv.style.display = controlsDiv.style.display === 'none' ? 'block' : 'none';
      }

      // M: MIDI setup
      if (key === 'm') {
        midiPopup.style.display = midiPopup.style.display === 'none' ? 'block' : 'none';
        if (!midiAccess) initMIDI();
      }

      // 1-4: Load avatars
      if (key >= '1' && key <= '4') {
        const index = parseInt(key) - 1;
        try {
          const fileHandles = await window.showOpenFilePicker({
            multiple: false,
            types: [{ description: 'GVRM Avatar', accept: { 'application/octet-stream': ['.gvrm'] } }]
          });
          const file = await fileHandles[0].getFile();
          const blob = new Blob([await file.arrayBuffer()]);
          const url = URL.createObjectURL(blob);
          const fileName = file.name;

          if (gvRMs[index]) await gvRMs[index].remove(scene);

          const newGvrm = await GVRM.load(url, scene, camera, renderer);
          const model = newGvrm.character.currentVrm.scene;
          model.position.set(index * 1.8, 0, 0);
          model.scale.setScalar(0.75);
          newGvrm.character.transitionDuration = 0;
          
          // Use existing custom animation or default
          if (customAnimations[index]) {
            await newGvrm.changeFBX(customAnimations[index]);
          } else {
            // Default animations loaded in init
          }
          newGvrm.character.action.play();
          gvRMs[index] = newGvrm;
        } catch (err) {
          console.warn('Avatar load cancelled or failed:', err);
        }
      }

      // QWER: Load animations for slots 1-4
      const animKeys = { 'q': 0, 'w': 1, 'e': 2, 'r': 3 };
      if (animKeys[key] !== undefined) {
        const index = animKeys[key];
        try {
          const fileHandles = await window.showOpenFilePicker({
            multiple: false,
            types: [{ description: 'FBX Animation', accept: { 'model/gltf-binary': ['.fbx'] } }]
          });
          const file = await fileHandles[0].getFile();
          const blob = new Blob([await file.arrayBuffer()]);
          const url = URL.createObjectURL(blob);
          const fileName = file.name;

          if (gvRMs[index]) {
            gvRMs[index].character.transitionDuration = 0;
            customAnimations[index] = url; // Store custom animation
            await gvRMs[index].changeFBX(url);
            gvRMs[index].character.action.play();
            updateAnimStatus(index, fileName);
          }
        } catch (err) {
          console.warn('Animation load cancelled or failed:', err);
        }
      }

      // 0: INSTANT reset to CUSTOM animations (not defaults)
      if (key === '0') {
        for (let i = 0; i < gvRMs.length; i++) {
          const g = gvRMs[i];
          if (!g) continue;
          g.character.transitionDuration = 0;
          if (customAnimations[i]) {
            // Play custom animation from start
            g.changeFBX(customAnimations[i]);
            g.character.action.time = 0;
            g.character.action.play();
          } else {
            // Fall back to default if no custom
            // (defaults already loaded during init)
            g.character.action.time = 0;
            g.character.action.play();
          }
        }
      }
    });

    // Render loop
    renderer.setAnimationLoop(() => {
      for (const g of gvRMs) g?.update();
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
